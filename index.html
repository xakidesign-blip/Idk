<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0e18; --text: #c4d8ff; --dim: #7f95c4; --pink: #ff8fc4; }
  * { box-sizing: border-box; }
  html { background-color: #0b0e18; }
  html, body { margin: 0; background: radial-gradient(ellipse at 50% 30%, #121a33 0%, var(--bg) 70%) fixed; color: var(--text); min-height: 100%; }
  body { font-family: "Cormorant Garamond", Georgia, serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 900px; margin: 0 auto; padding: 12px 14px 60px; }
  canvas { display: block; width: 100%; }
  #letter { max-width: 560px; margin: 4px auto 0; font-size: clamp(19px, 4.6vw, 23px); line-height: 1.55; min-height: 6em; }
  #letter p { margin: 0 0 0.9em; white-space: pre-wrap; }
  #letter .sig { text-align: right; color: var(--pink); font-style: italic; margin-top: 1.2em; }
  .caret { display: inline-block; width: 0.5em; border-bottom: 2px solid var(--text); margin-left: 1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #again { display: none; margin: 28px auto 0; background: none; border: 1px solid #3a4c7a; color: var(--dim);
           font: inherit; font-size: 17px; padding: 8px 20px; border-radius: 999px; cursor: pointer; }
  #again:hover { color: var(--text); border-color: var(--dim); }
  #intro { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 18px; background: rgba(8, 10, 20, 0.82); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
           transition: opacity 0.9s ease; z-index: 5; text-align: center; padding: 24px; }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro h1 { font-weight: 500; font-style: italic; font-size: clamp(34px, 9vw, 54px); margin: 0; color: var(--text); }
  #intro button { background: none; border: 1px solid var(--pink); color: var(--pink); font: inherit; font-size: 20px;
                  padding: 10px 28px; border-radius: 999px; cursor: pointer; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 22px rgba(255, 143, 196, 0.35); } }
</style>
</head>
<body>
<div id="intro">
  <h1 id="introTitle"></h1>
  <button id="open" type="button">tap to open</button>
</div>

  <div style="text-align:center"><button id="again" type="button">read it again</button></div>
</main>

    const i = idx[c]; if (i < 0) continue;
    const kind = K[i] & 3, chi = K[i] >> 2;
    let vx = V[3 * i] / 127, vy = V[3 * i + 1] / 127, vz = V[3 * i + 2] / 127;
    const X = r00 * vx + r01 * vy + r02 * vz, Y = r10 * vx + r11 * vy + r12 * vz, Z = r20 * vx + r21 * vy + r22 * vz;
    const dz = 0.7 + 0.3 * Math.min(1, Math.max(0, (depth[c] + 1) / 2));
    let ch, shade, spec = 0;
    if (kind === 1) {
      let a = Math.atan2(-Y, X * 2) * 180 / Math.PI; a = ((a % 180) + 180) % 180;
      ch = a < 22.5 ? "-" : a < 67.5 ? "\\" : a < 112.5 ? "|" : a < 157.5 ? "/" : "-";
      shade = dz;
    } else if (kind === 2) {
      ch = FIXED[chi]; shade = dz;
    } else {
      let nx = X, ny = Y, nz = Z;
      if (nz < 0) { nx = -nx; ny = -ny; nz = -nz; }
      const nl = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
      const lum = 0.3 + 0.7 * nl;
      const d = nx * L[0] + ny * L[1] + nz * L[2];
      spec = Math.pow(Math.max(0, 2 * d * nz - L[2]), 14);
      const v = Math.min(1, lum + spec * 0.4);
      ch = RAMP[Math.min(RAMP.length - 1, Math.floor(v * (RAMP.length - 1)))];
      shade = (0.5 + 0.7 * lum) * dz;
    }
    let r = COL[3 * i] * shade, g = COL[3 * i + 1] * shade, b = COL[3 * i + 2] * shade;
    if (kind === 0) {
      r += spec * 90; g += spec * 90; b += spec * 90;
      const me = gid[c], x = c % cols;
      const edge = (x + 1 < cols && gid[c + 1] && gid[c + 1] !== me) || (x > 0 && gid[c - 1] && gid[c - 1] !== me) ||
                   (c + cols < gid.length && gid[c + cols] && gid[c + cols] !== me) || (c >= cols && gid[c - cols] && gid[c - cols] !== me);
      if (edge) { r *= 0.45; g *= 0.45; b *= 0.45; }
    }
    ctx.fillStyle = `rgb(${Math.min(255, r) | 0},${Math.min(255, g) | 0},${Math.min(255, b) | 0})`;
    ctx.fillText(ch, (c % cols + 0.5) * cw, (Math.floor(c / cols) + 0.5) * chh);
  }
}

// ---------- letter ----------
const letterEl = document.getElementById("letter"), againBtn = document.getElementById("again");
const paras = LETTER.trim().split(/\n\s*\n/);
const total = paras.reduce((n, p) => n + p.length, 0);
let typeStart = null;
function renderLetter(now) {
  if (typeStart === null) return;
  let left = Math.floor((now - typeStart) / 1000 * TYPE_SPEED);
  const done = left >= total;
  const out = [];
  for (const p of paras) {
    if (left <= 0) break;
    out.push(p.slice(0, left)); left -= p.length;
  }
  let html = out.map((p, i) => `<p>${esc(p)}${!done && i === out.length - 1 ? '<span class="caret"></span>' : ""}</p>`).join("");
  if (done) {
    if (SIGNATURE) html += `<p class="sig">${esc(SIGNATURE)}</p>`;
    againBtn.style.display = "inline-block";
  }
  if (html !== letterEl._last) { letterEl.innerHTML = html; letterEl._last = html; }
}
const esc = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

document.getElementById("introTitle").textContent = INTRO_TITLE;
document.getElementById("open").addEventListener("click", () => {
  document.getElementById("intro").classList.add("gone");
  setTimeout(() => { typeStart = performance.now(); }, 1400);
});
againBtn.addEventListener("click", () => {
  againBtn.style.display = "none"; letterEl._last = null; letterEl.innerHTML = "";
  typeStart = performance.now() + 400;
  window.scrollTo({ top: 0, behavior: "smooth" });
});

// ---------- loop ----------
layout();
let lastW = 0;
window.addEventListener("resize", () => { if (canvas.parentElement.clientWidth !== lastW) layout(); });
const t0 = performance.now();
let lastFrame = 0;
function loop(now) {
  if (now - lastFrame > 1000 / 32) {
    lastFrame = now; lastW = canvas.parentElement.clientWidth;
    frame((now - t0) / 1000);
    renderLetter(now);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
